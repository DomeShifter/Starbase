<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <!-- Starbase Docs is light whatever the system prefers (src/theme.rs). -->
  <meta name="color-scheme" content="light">
  <title>Starbase Docs</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link data-trunk rel="copy-file" href="favicon.svg" />
  <link data-trunk rel="copy-file" href="favicon.ico" />
  <link data-trunk rel="copy-file" href="apple-touch-icon.png" />
  <!-- Carlito and Caladea (Calibri and Cambria widths), fetched after start: src/bundled_fonts.rs -->
  <link data-trunk rel="copy-dir" href="fonts/office" />
  <link data-trunk rel="rust" data-bin="stardocs" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f9fbfd; }
    #stardocs_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #stardocs_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="stardocs_canvas"></canvas>
  <div id="stardocs_loading">Loading Starbase Docs&hellip;</div>
<script>
  // A file made from a template and closed without a change is removed again (the server only
  // does it while the file is still exactly what was created, and nobody else has opened it).
  (function () {
    var q = new URLSearchParams(location.search), id = q.get('file'), fresh = q.get('fresh'), was = q.get('was');
    if (!id || !fresh || !was) return;
    window.addEventListener('pagehide', function () {
      try {
        navigator.sendBeacon('../' + 'api/files/' + encodeURIComponent(id) + '/discard?version=' + encodeURIComponent(fresh) + '&name=' + encodeURIComponent(was));
      } catch (e) {}
    });
  })();
</script>
</body>
</html>
