# GENERATED by scripts/gen-cargo.py from upstream/deckcraft/Cargo.toml: edit that script, not this file.
[workspace]
resolver = "3"
members = ["app"]

[workspace.package]
version = "0.18.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/DomeShifter/Starbase"

[workspace.dependencies]
# internal
deckcraft-geom = { path = "upstream/deckcraft/crates/geom" }
deckcraft-color = { path = "upstream/deckcraft/crates/color" }
deckcraft-metafile = { path = "upstream/deckcraft/crates/metafile" }
deckcraft-model = { path = "upstream/deckcraft/crates/model" }
deckcraft-fonts = { path = "upstream/deckcraft/crates/fonts" }
deckcraft-text = { path = "upstream/deckcraft/crates/text" }
deckcraft-render = { path = "upstream/deckcraft/crates/render" }
deckcraft-pdf = { path = "upstream/deckcraft/crates/pdf" }
deckcraft-pptx = { path = "upstream/deckcraft/crates/pptx" }
deckcraft-format = { path = "upstream/deckcraft/crates/format" }
deckcraft-anim = { path = "upstream/deckcraft/crates/anim" }
deckcraft-engine = { path = "upstream/deckcraft/crates/engine" }
deckcraft-ui-egui = { path = "upstream/deckcraft/crates/ui-egui" }
deckcraft-media = { path = "upstream/deckcraft/crates/media" }
# video codecs (ported from FilmCraft, same owner and licence)
deckcraft-bitstream = { path = "upstream/deckcraft/crates/bitstream" }
deckcraft-h264 = { path = "upstream/deckcraft/crates/h264" }
deckcraft-hevc = { path = "upstream/deckcraft/crates/hevc" }
deckcraft-vp9 = { path = "upstream/deckcraft/crates/vp9" }
deckcraft-av1 = { path = "upstream/deckcraft/crates/av1" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
# Base features are wasm-safe (`std` only). The non-wasm `clock` feature is requested
# per-crate for targets that read the local clock (see crates/text).
chrono = { version = "0.4", default-features = false, features = ["std"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
vello_cpu = "0.2"
vello_common = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# craft-media and craft-audio share types and stay on one rev.
craft-media = { git = "https://github.com/storytold/craft-libs", rev = "75895c0321d8cb6e175a42466cba050352b117c5", version = "=0.1.0", default-features = false }
craft-audio = { git = "https://github.com/storytold/craft-libs", rev = "75895c0321d8cb6e175a42466cba050352b117c5", version = "=0.1.0", default-features = false, features = ["opus-decode"] }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", version = "=0.1.0", default-features = false, features = ["write", "write-simple-text"] }
# craft-update: app-specific pretend versions apply to startup and manual checks.
craft-update = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", features = ["egui"] }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", version = "=0.1.0" }
i_overlay = "9"
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# ui
egui = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
web-time = "1.1"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
type_complexity = "allow"
self_named_constructors = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

# Line tables keep file and line in panics and backtraces; full debug info
# for every test binary and dependency would multiply the target dir size.
# The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
strip = "symbols"
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = 0

[profile.release.package.deckcraft-render]
opt-level = 3

[profile.release.package.deckcraft-text]
opt-level = 3

[profile.release.package.vello_cpu]
opt-level = 3

[profile.release.package.vello_common]
opt-level = 3

[profile.release.package.fearless_simd]
opt-level = 3

[profile.release.package.peniko]
opt-level = 3

[profile.release.package.kurbo]
opt-level = 3

[profile.release.package.harfrust]
opt-level = 3

[profile.release.package.skrifa]
opt-level = 3

