# Flatpak manifest for Starbase: one app ID, two programs (starsheets, stardocs), three menu
# entries. Adapted from WordCraft's packaging/linux/flatpak/ai.storyteller.wordcraft.yml
# (storytold/wordcraft, MIT OR Apache-2.0).
#
# Built and smoke-tested by .github/workflows/flatpak.yml (artifact `starbase-flatpak`).
#
# Flatpak builds run offline: everything is downloaded by flatpak-builder before the build starts,
# from the sources listed here. That means:
#   - Crates: one generated cargo-sources-<workspace>.json per Cargo workspace (starsheets/ and
#     stardocs/ each have their own Cargo.lock). They are NOT committed here: they are
#     regenerated from the lockfiles on every CI run, so they can never go stale after a lockfile
#     change, and this repository does not carry thousands of lines of generated JSON. Flathub
#     cannot run the generator, so for a Flathub submission they are generated once per release
#     and committed in the Flathub manifest repository next to this manifest.
#   - Engines: GridCraft and WordCraft come from our forks as `git` sources pinned to the commits
#     in starsheets/upstream.pin and stardocs/upstream.pin. pin-engines.sh (next to this file)
#     copies them in; CI runs it before building and warns if the committed lines were behind.
#   - Fonts: the desktop programs only embed fonts that are committed (starsheets/app/fonts,
#     stardocs/app/fonts). The web fonts and the word list that starsheets/scripts/fetch-*.py
#     download are used by the web build only, so they are not sources here. If a native build
#     ever embeds them, add them as `file` sources (url + sha256).
#
# Local build (needs ~30 GB of disk and a long time; CI does this):
#
#   python3 flatpak-cargo-generator.py starsheets/Cargo.lock -o packaging/linux/flatpak/cargo-sources-starsheets.json
#   python3 flatpak-cargo-generator.py stardocs/Cargo.lock   -o packaging/linux/flatpak/cargo-sources-stardocs.json
#   for ws in starsheets stardocs; do   # one cargo source entry per git revision (see the script)
#     python3 packaging/linux/flatpak/vendor-config.py $ws/Cargo.lock packaging/linux/flatpak/cargo-sources-$ws.json; done
#   flatpak run org.flatpak.Builder --user --install --install-deps-from=flathub --force-clean \
#     build-flatpak packaging/linux/flatpak/io.github.DomeShifter.Starbase.yml
#   flatpak run --command=starsheets io.github.DomeShifter.Starbase --home   # Starbase Drive
#   flatpak run --command=stardocs io.github.DomeShifter.Starbase           # Starbase Docs
#
# For Flathub, the `dir` sources become one `git` source pinned to a release tag and commit, and
# the two generated JSON files are committed in the Flathub manifest repository.
id: io.github.DomeShifter.Starbase
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: starsheets
finish-args:
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Network: "Connect to a server" (a Starbase server for shared files and live editing).
  - --share=network
  # Local mode works on one folder, ~/Documents/Starbase, created on first run. Files anywhere
  # else are opened through the file-chooser portal and drag and drop through the document
  # portal, so no broader filesystem access is needed.
  - --filesystem=xdg-documents/Starbase:create
  # Deliberately not granted: home/host filesystem access, org.freedesktop.Flatpak (Flathub does
  # the updating), WordCraft's xdg-data/ArtCraft/versions. Printing (upstream's cups-client
  # module, --socket=cups, Avahi, ~/.cups:ro) is left out until the native apps can print.
  # The server sign-in token is meant to go through the Secret portal (keyring crate), which
  # needs no extra permission.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: starsheets
    buildsystem: simple
    subdir: starsheets
    build-options:
      env:
        # flatpak-cargo-generator's sources unpack into <module build dir>/cargo.
        CARGO_HOME: /run/build/starsheets/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      # Unused [patch] entries break the vendored build; see prune-patches.py.
      - python3 ../packaging/linux/flatpak/prune-patches.py Cargo.toml Cargo.lock
      - cargo --offline build --release --locked -p starsheets
      - install -Dm755 target/release/starsheets /app/bin/starsheets
    sources:
      - type: dir
        path: ../../..
        skip:
          - .git
          - .github
          - .flatpak-builder
          - build-flatpak
          - repo
          - dist
          - docs
          - stardocs
          - starsheets/target
          - starsheets/upstream
      # GridCraft: our fork's `starsheets` branch at the commit in starsheets/upstream.pin (what
      # starsheets/scripts/fetch-upstream.sh fetches). pin-engines.sh keeps the two equal.
      - type: git
        url: https://github.com/DomeShifter/gridcraft.git
        commit: b51979c8ab24aba7b39f3c22bac323289d3e6545
        dest: starsheets/upstream/gridcraft
      - cargo-sources-starsheets.json

  - name: stardocs
    buildsystem: simple
    subdir: stardocs
    build-options:
      env:
        CARGO_HOME: /run/build/stardocs/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      # Unused [patch] entries break the vendored build; see prune-patches.py.
      - python3 ../packaging/linux/flatpak/prune-patches.py Cargo.toml Cargo.lock
      - cargo --offline build --release --locked -p stardocs
      - install -Dm755 target/release/stardocs /app/bin/stardocs
    sources:
      - type: dir
        path: ../../..
        skip:
          - .git
          - .github
          - .flatpak-builder
          - build-flatpak
          - repo
          - dist
          - docs
          - starsheets
          - stardocs/target
          - stardocs/upstream
      # WordCraft: our fork's `stardocs` branch at the commit in stardocs/upstream.pin. Keep the
      # two equal (pin-engines.sh). stardocs/Cargo.toml is committed, so gen-cargo.py need not run.
      - type: git
        url: https://github.com/DomeShifter/wordcraft.git
        commit: f0726a5c2faeabdd29e7ca30b647891910117088
        dest: stardocs/upstream/wordcraft
      - cargo-sources-stardocs.json

  # Menu entries, MIME types, metainfo, icons and licences for the whole package.
  - name: starbase-data
    buildsystem: simple
    build-commands:
      - >-
        for entry in io.github.DomeShifter.Starbase io.github.DomeShifter.Starbase.Sheets io.github.DomeShifter.Starbase.Docs; do
        install -Dm644 packaging/linux/$entry.desktop /app/share/applications/$entry.desktop; done
      - install -Dm644 packaging/linux/io.github.DomeShifter.Starbase.mime.xml /app/share/mime/packages/io.github.DomeShifter.Starbase.xml
      - packaging/linux/icons.sh /app/share/icons
      # Starbase has no package version of its own yet (the two workspaces are versioned
      # separately). CI replaces 0.0.0-dev below with the same version the AppImage gets.
      - >-
        version=0.0.0-dev;
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/io.github.DomeShifter.Starbase.metainfo.xml.in > /app/share/metainfo/io.github.DomeShifter.Starbase.metainfo.xml
      - install -Dm644 -t /app/share/licenses/io.github.DomeShifter.Starbase LICENSE-MIT LICENSE-APACHE NOTICE
    sources:
      - type: dir
        path: ../../..
        skip:
          - .git
          - .github
          - .flatpak-builder
          - build-flatpak
          - repo
          - dist
          - docs
          - starsheets
          - stardocs
      # icons.sh reads the apps' SVGs; only these files are needed from the app folders.
      - type: file
        path: ../../../starsheets/app/favicon.svg
        dest: starsheets/app
      - type: file
        path: ../../../starsheets/app/stardrive.svg
        dest: starsheets/app
      - type: file
        path: ../../../stardocs/app/icons/stardocs_logo.svg
        dest: stardocs/app/icons
