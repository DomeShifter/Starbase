# StarSheets: builds the web app on every push and pull request that touches starsheets/. The built site is kept as the
# `starsheets-web` artifact; a self-hosted server can pull the latest one from main
# (docs/deploy.md). A version tag (vX.Y.Z) also publishes the Docker image and drafts a release.
name: StarSheets
on:
  push:
    branches: [main]
    tags: ["starsheets-v*"]
    paths: ["starsheets/**", ".github/workflows/starsheets.yml"]
  pull_request:
    paths: ["starsheets/**", ".github/workflows/starsheets.yml"]
  workflow_dispatch:
  workflow_call: # from release.yml (the Starbase image)

permissions:
  contents: read

# A newer push to a pull request cancels the older run. Runs on main always finish: each merge is
# checked, and main's runs are the only ones that save build caches.
concurrency:
  group: starsheets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Tabs and the server must run the same engine: both builds carry the commit (crates/sync).
  STARSHEETS_BUILD: ${{ github.sha }}
  TRUNK_VERSION: v0.22.2

defaults:
  run:
    working-directory: starsheets

jobs:
  web:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Fetch GridCraft at the pinned commit of our fork
        run: scripts/fetch-upstream.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Caches: shared by key across jobs and workflows that build the same thing, saved only on
      # main (GitHub keeps 10 GB per repository; pull-request caches used to push main's out).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: starsheets-wasm-release
          workspaces: starsheets
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin trunk
          trunk --version
      - name: Fetch web fonts (Google Fonts, OFL/Apache)
        run: python3 scripts/fetch-fonts.py
      - name: Fetch the spelling word list (SCOWL)
        run: python3 scripts/fetch-dictionary.py
      # wasm-opt only shrinks the file (~1.5 min); a pull request's build is never served.
      - name: No wasm-opt on pull requests
        if: github.event_name == 'pull_request'
        working-directory: starsheets/app
        run: sed -i 's/data-wasm-opt="z"/data-wasm-opt="0"/' index.html && grep -q 'data-wasm-opt="0"' index.html
      - name: Build
        working-directory: starsheets/app
        run: trunk build --release
      - name: Record build info
        run: |
          printf '{"commit":"%s","upstream":"%s","built":"%s"}\n' "$GITHUB_SHA" "$(sed -n 's/^tag = "\(.*\)"/\1/p' upstream.pin)" "$(date -u +%FT%TZ)" > dist/build.json
          du -sh dist; ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: starsheets-web
          path: starsheets/dist/
          retention-days: 30

  server:
    name: Build server (Linux amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Fetch GridCraft at the pinned commit of our fork
        run: scripts/fetch-upstream.sh
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/cargo-home/registry
            ~/cargo-home/git
            starsheets/target
          key: server-${{ hashFiles('starsheets/Cargo.lock') }}
          restore-keys: server-
      # Built inside Debian 13, the same C library as the Docker image and Debian servers.
      - name: Build
        run: |
          mkdir -p ~/cargo-home
          docker run --rm -v "$PWD":/src -v ~/cargo-home:/cargo-home -e CARGO_HOME=/cargo-home -e STARSHEETS_BUILD -w /src rust:1.100.0-trixie bash -c '
            set -e
            apt-get update -qq && apt-get install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross >/dev/null
            rustup target add aarch64-unknown-linux-gnu
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            cargo build --release -p starsheets-server --target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu
            mkdir -p server-bin/amd64 server-bin/arm64
            cp target/x86_64-unknown-linux-gnu/release/starsheets-server server-bin/amd64/
            cp target/aarch64-unknown-linux-gnu/release/starsheets-server server-bin/arm64/
            chown -R '"$(id -u):$(id -g)"' server-bin target /cargo-home'
          ls -la server-bin/*
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/cargo-home/registry
            ~/cargo-home/git
            starsheets/target
          key: server-${{ hashFiles('starsheets/Cargo.lock') }}
      - name: Same answers as the old Python server
        run: python3 crates/server/tests/parity.py server-bin/amd64/starsheets-server
      - uses: actions/upload-artifact@v7
        with:
          name: starsheets-server
          path: starsheets/server-bin/
          retention-days: 30

  test:
    # Also the desktop program's checks on every run (clippy on the native target, a debug build
    # that starts); the release build is the desktop job below (main and tags).
    name: Tests (native)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Fetch GridCraft at the pinned commit of our fork
        run: scripts/fetch-upstream.sh
      - name: System libraries for egui's native backends
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libxkbcommon-dev libwayland-dev pkg-config libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: starsheets-native-dev
          workspaces: starsheets
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: exiftool (the GPS-stripping test needs the reference reader)
        run: sudo apt-get install -y -qq libimage-exiftool-perl
      - name: Test
        run: cargo test -p starsheets -p starsheets-server -p starsheets-sync -p starbase-connect -p starbase-open -p starbase-photo-edit
      # Web-only helpers (accounts, sharing, web fonts, the spelling list download) are behind
      # cfg(target_arch = "wasm32"), so the desktop build has no unused code either.
      - name: Clippy (desktop app)
        run: cargo clippy -p starsheets -- -D warnings
      - name: Desktop app builds and starts (debug build)
        run: |
          cargo build -p starsheets -p starsheets-server -p starsheets-sync -p starbase-connect -p starbase-open
          target/debug/starsheets --version
          target/debug/starsheets --help

  desktop:
    # The desktop program (app/src/native.rs, docs/research/desktop-plan.md D1a): the release build
    # for Linux and a start-up check; the executable is kept as an artifact. Its tests and clippy
    # run in the test job. Not on pull requests (the test job's debug build checks it compiles and
    # starts). On ubuntu-22.04 with the same cache as the Desktop workflow's starsheets build.
    name: Desktop app (Linux)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The scripts use tomllib (Python 3.11+); ubuntu-22.04 ships 3.10.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch GridCraft at the pinned commit of our fork
        run: scripts/fetch-upstream.sh
      - name: System libraries for egui's native backends
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libxkbcommon-dev libwayland-dev pkg-config libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: starsheets-native-release-2204
          workspaces: starsheets
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --release -p starsheets
      - name: It starts
        run: |
          target/release/starsheets --version
          target/release/starsheets --help
      - uses: actions/upload-artifact@v7
        with:
          name: starsheets-linux-x86_64
          path: starsheets/target/release/starsheets
          retention-days: 14

  lint:
    # Formatting (rustfmt.toml) and clippy with warnings as errors: the web app as it is built
    # (wasm32), the server and the sync crate with their tests. Fix, don't silence: an #[allow]
    # says why on the line above it.
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Flatpak manifest commits equal the upstream.pin files
        run: ../packaging/linux/flatpak/pin-engines.sh --check
      - name: Fetch GridCraft at the pinned commit of our fork
        run: scripts/fetch-upstream.sh
      # starbase-open asks its one question with the system's dialogs (rfd: Wayland/GTK).
      - name: System libraries for the desktop dialogs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libxkbcommon-dev libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: starsheets-check
          workspaces: starsheets
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting
        # Our packages only: GridCraft (upstream/) keeps its own formatting.
        run: cargo fmt -p starsheets -p starsheets-server -p starsheets-sync -p starbase-connect -p starbase-open -p starbase-photo-edit --check
      - name: Clippy (web app)
        run: cargo clippy -p starsheets -p starbase-photo-edit --target wasm32-unknown-unknown -- -D warnings
      - name: Clippy (server and sync, with tests)
        run: cargo clippy -p starsheets-server -p starsheets-sync -p starbase-connect -p starbase-open -p starbase-photo-edit --all-targets -- -D warnings

  speed:
    # Speed and memory check on a big many-tab workbook (crates/sync/examples/bench.rs): the
    # table lands in the run's summary. Not a pass/fail test and not needed for a release.
    name: Speed check (big workbook)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Fetch GridCraft at the pinned commit of our fork
        run: scripts/fetch-upstream.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: starsheets-speed
          workspaces: starsheets
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Speed check
        run: cargo run --release -p starsheets-sync --example bench

  gridcraft:
    # GridCraft's own tests, on our fork's pinned commit: every crate, including the Google
    # functions (sheets-functions). Our changes to the engine, the xlsx reader/writer and the
    # grid are only proven by these. A test set aside says why in its #[ignore = "..."].
    name: GridCraft tests (our fork)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Fetch GridCraft at the pinned commit of our fork
        run: scripts/fetch-upstream.sh
      - name: System libraries for egui's native backends
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libxkbcommon-dev libwayland-dev pkg-config libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gridcraft-native-dev
          workspaces: starsheets/upstream/gridcraft
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test every GridCraft crate
        run: scripts/test-gridcraft.sh

  release:
    name: Release (Docker image + draft release)
    if: startsWith(github.ref, 'refs/tags/starsheets-v')
    needs: [web, test, server, gridcraft, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag must match the version in Cargo.toml
        run: |
          want="starsheets-v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $want"; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#starsheets-v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: starsheets-web
          path: starsheets/site
      - uses: actions/download-artifact@v8
        with:
          name: starsheets-server
          path: starsheets/server-bin
      - name: Compress the site (served pre-compressed) and zip it for the release
        run: |
          (cd site && zip -qr "../starsheets-web-$VERSION.zip" .)
          find site -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.svg' -o -name '*.json' -o -name '*.txt' \) -exec gzip -k -9 {} \;
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: starsheets
          file: starsheets/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/domeshifter/starsheets:${{ env.VERSION }}
            ghcr.io/domeshifter/starsheets:latest
          labels: |
            org.opencontainers.image.source=https://github.com/DomeShifter/Starbase
            org.opencontainers.image.description=A spreadsheet that looks and feels like Google Sheets, that you can run yourself.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - name: Draft the release (notes from CHANGELOG.md)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on && !/^\[[^]]*\]: http/ {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          printf '\n---\n**Docker:** `docker run -p 8080:8080 -v starsheets:/data ghcr.io/domeshifter/starsheets:%s` (see docker/compose.yml)\n' "$VERSION" >> notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "Starbase Sheets $VERSION" --notes-file notes.md "starsheets-web-$VERSION.zip"

