# Slides corpus: opens and saves every deck of the .pptx test corpus (slides/corpus/) with
# deckcraft-cli, the engine Starbase Slides is built on, and checks what changed: a python-pptx
# inventory diff (slides, shapes, text, pictures, tables, charts, notes, transitions, OLE, controls),
# a second save that must change nothing, and LibreOffice PDF renders of the original and the saved
# file (page counts + a rough per-page pixel difference). The job summary has the table. It fails
# only when something got worse than slides/corpus/baseline.json: some losses are known and listed
# there. To refresh the baseline: run this workflow by hand with "write_baseline", download the
# `slides-corpus` artifact and commit its results.json as slides/corpus/baseline.json.
name: Slides corpus
on:
  pull_request:
    paths: ["slides/**", ".github/workflows/slides-corpus.yml"]
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:
    inputs:
      write_baseline:
        description: "Do not judge; produce a new baseline (results.json in the artifact)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: slides-corpus-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The DeckCraft release the Slides app is pinned to: tag and the commit it must point at.
  DECKCRAFT_TAG: v0.18.1
  DECKCRAFT_COMMIT: 7cc73ab1895ed2e30c8afbcada20c70b9ea0a440
  CARGO_TERM_COLOR: always

jobs:
  roundtrip:
    name: .pptx round trip (deckcraft-cli)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Reuse a deckcraft-cli built earlier for this commit
        id: cli-cache
        uses: actions/cache@v6
        with:
          path: ~/deckcraft-bin
          key: deckcraft-cli-${{ env.DECKCRAFT_COMMIT }}-ubuntu-24.04-v1

      - name: Fetch DeckCraft at the pinned tag
        if: steps.cli-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: storytold/deckcraft
          ref: ${{ env.DECKCRAFT_TAG }}
          path: _deckcraft
          persist-credentials: false

      - name: Check the tag still points at the pinned commit
        if: steps.cli-cache.outputs.cache-hit != 'true'
        working-directory: _deckcraft
        run: |
          got=$(git rev-parse HEAD)
          echo "$DECKCRAFT_TAG -> $got"
          [ "$got" = "$DECKCRAFT_COMMIT" ] || { echo "::error::$DECKCRAFT_TAG now points at $got, not $DECKCRAFT_COMMIT"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        if: steps.cli-cache.outputs.cache-hit != 'true'

      - name: Build deckcraft-cli (release)
        if: steps.cli-cache.outputs.cache-hit != 'true'
        working-directory: _deckcraft
        run: |
          cargo build --release --locked -p deckcraft-cli
          mkdir -p ~/deckcraft-bin && cp target/release/deckcraft-cli ~/deckcraft-bin/
          ~/deckcraft-bin/deckcraft-cli --version || true

      - name: Install LibreOffice and poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-impress poppler-utils fonts-liberation fonts-dejavu-core fonts-noto-cjk
          soffice --version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: slides/corpus/requirements.txt

      - name: Build the corpus
        run: |
          pip install -q -r slides/corpus/requirements.txt
          mkdir -p "$RUNNER_TEMP/decks"
          python slides/corpus/make_decks.py "$RUNNER_TEMP/decks"
          # gen-06: deck 1 saved again by LibreOffice (a deck written by another program)
          mkdir -p "$RUNNER_TEMP/lo-resave"
          soffice -env:UserInstallation=file://$RUNNER_TEMP/lo-profile --headless --norestore \
            --convert-to "pptx:Impress MS PowerPoint 2007 XML" --outdir "$RUNNER_TEMP/lo-resave" "$RUNNER_TEMP/decks/gen-01-text-review.pptx"
          mv "$RUNNER_TEMP/lo-resave/gen-01-text-review.pptx" "$RUNNER_TEMP/decks/gen-06-lo-resaved.pptx"
          python slides/corpus/fetch.py "$RUNNER_TEMP/decks"
          ls "$RUNNER_TEMP/decks" | wc -l

      - name: Round trip and compare
        run: |
          python slides/corpus/run.py --cli ~/deckcraft-bin/deckcraft-cli --decks "$RUNNER_TEMP/decks" \
            --work "$RUNNER_TEMP/work" --results "$RUNNER_TEMP/work/results.json" --summary "$GITHUB_STEP_SUMMARY" \
            ${{ inputs.write_baseline && '--write-baseline' || '' }}

      - name: Keep results, saved decks and PDFs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slides-corpus
          path: |
            ${{ runner.temp }}/work/results.json
            ${{ runner.temp }}/work/rt1/
            ${{ runner.temp }}/work/pdf-orig/
            ${{ runner.temp }}/work/pdf-rt1/
          retention-days: 14
          if-no-files-found: ignore
