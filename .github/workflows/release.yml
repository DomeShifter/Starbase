# Starbase release: one Docker image for the whole suite.
# A suite version tag (vX.Y.Z) rebuilds the apps (the StarSheets, StarDocs and Starbase Slides
# workflows, called from here, tests included), puts StarSheets' site at /, StarDocs' at /docs/ and
# Slides' at /slides/ next to the file server, pushes ghcr.io/domeshifter/starbase:<version> and
# :latest (amd64 + arm64) and drafts a GitHub release with the notes from CHANGELOG.md's section
# for that version, with the changelog files still in changes/ added (changes/assemble.py).
# Run by hand (Actions › Release › Run workflow) it does the same build without pushing or
# releasing, and keeps an amd64 image as the `starbase-image` artifact for trying it out:
#   docker load -i starbase-amd64.tar && docker run -p 8080:8080 ghcr.io/domeshifter/starbase:test
#
# The Flatpak goes into our own signed Flatpak repository on GitHub Pages (Flathub is not an
# option for now: packaging/linux/flathub-submission.md). A version tag publishes it once every
# other job is green; by hand it is only built and kept as the `flatpak-repo-site` artifact,
# unless "publish_flatpak_repo" is ticked (Pages only accepts main and v* tags). The very first
# publish is a run by hand on main with both boxes ticked (packaging/README.md).
#
# The Windows preview (desktop-other.yml, Windows only: unsigned per-user MSI and portable zip) is
# built in the same run; for a version tag both go on the release, in SHA256SUMS and GPG-signed.
#
# The release key's secrets live in the `release-signing` environment (tags v* and main only),
# used by the two signing jobs alone.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_flatpak_repo:
        description: Also publish the Flatpak repository on GitHub Pages
        type: boolean
        default: false
      flatpak_repo_start_empty:
        description: Start the Flatpak repository empty (first publish only; otherwise it fails if nothing is published)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  starsheets:
    name: StarSheets
    uses: ./.github/workflows/starsheets.yml
    # Its own release job (starsheets-v* tags only) is skipped, but asks for these.
    permissions:
      contents: write
      packages: write

  stardocs:
    name: StarDocs
    uses: ./.github/workflows/stardocs.yml

  slides:
    name: Starbase Slides
    uses: ./.github/workflows/slides.yml

  desktop:
    name: Desktop (AppImage)
    uses: ./.github/workflows/desktop.yml

  flatpak:
    name: Flatpak
    uses: ./.github/workflows/flatpak.yml

  windows:
    name: Windows preview (unsigned MSI and zip)
    uses: ./.github/workflows/desktop-other.yml
    with:
      windows_only: true

  image:
    name: Docker image
    needs: [starsheets, stardocs, slides]
    # A release needs every check green. A test build (by hand) goes on when only a check failed:
    # the next step stops it if a build is missing.
    if: >-
      !cancelled() && ((needs.starsheets.result == 'success' && needs.stardocs.result == 'success'
      && needs.slides.result == 'success') || !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - name: Version
        run: |
          if [ "$RELEASE" = true ]; then v="${GITHUB_REF_NAME#v}"; else v="test"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      # Each pull request adds a changes/<topic>.md file instead of editing CHANGELOG.md
      # (CONTRIBUTING.md, "Changelog"). Here they are gathered into this version's section (on
      # this runner's copy only; the release-preparation pull request commits it for good).
      - name: Release notes from CHANGELOG.md
        run: |
          if [ "$RELEASE" = true ]; then
            python3 changes/assemble.py --version "$VERSION" --write --keep > /dev/null
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on && !/^\[[^]]*\]: http/ {print}' CHANGELOG.md > notes.md
          else
            python3 changes/assemble.py --unreleased > notes.md
          fi
          [ -s notes.md ] || { echo "no release notes: CHANGELOG.md has no section for $VERSION and changes/ is empty"; exit 1; }
          printf '\n---\n**Docker:** `docker run -d -p 8080:8080 -v starbase:/data ghcr.io/domeshifter/starbase:%s`. Install guides (Docker, Proxmox, TrueNAS, Unraid): docs/install/.\n' "$VERSION" >> notes.md
          cat notes.md
      - uses: actions/download-artifact@v8
        with:
          name: starsheets-web
          path: build/site
      - uses: actions/download-artifact@v8
        with:
          name: stardocs-web
          path: build/site/docs
      - uses: actions/download-artifact@v8
        with:
          name: slides-web
          path: build/site/slides
      - uses: actions/download-artifact@v8
        with:
          name: starsheets-server
          path: build/server-bin
      - name: Zip the sites for the release, then compress them (served pre-compressed)
        working-directory: build
        run: |
          [ -f site/index.html ] && [ -f site/docs/index.html ] && [ -f site/slides/index.html ] && [ -f server-bin/amd64/starsheets-server ] && [ -f server-bin/arm64/starsheets-server ]
          (cd site && zip -qr "../starbase-web-$VERSION.zip" .)
          ../scripts/precompress.sh site
          cp ../docker/Dockerfile .
          du -sh site site/docs site/slides; ls -la server-bin/*
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (amd64 + arm64), pushed only for a version tag
        uses: docker/build-push-action@v7
        with:
          context: build
          platforms: linux/amd64,linux/arm64
          push: ${{ env.RELEASE == 'true' }}
          tags: |
            ghcr.io/domeshifter/starbase:${{ env.VERSION }}
            ${{ env.RELEASE == 'true' && 'ghcr.io/domeshifter/starbase:latest' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/DomeShifter/Starbase
            org.opencontainers.image.description=Starbase: spreadsheets and documents you host yourself, familiar to Google Workspace users.
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Keep an amd64 image to try (run by hand only)
        if: env.RELEASE != 'true'
        uses: docker/build-push-action@v7
        with:
          context: build
          platforms: linux/amd64
          tags: ghcr.io/domeshifter/starbase:test
          outputs: type=docker,dest=starbase-amd64.tar
      - uses: actions/upload-artifact@v7
        if: env.RELEASE != 'true'
        with:
          name: starbase-image
          path: starbase-amd64.tar
          retention-days: 7
      - name: Draft the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Starbase $VERSION" --notes-file notes.md "build/starbase-web-$VERSION.zip"

  sign:
    # Signs every download on the draft release (Linux, and the Windows preview) with the project's release key
    # (packaging/linux/starbase-release-signing.asc): SHA256SUMS + SHA256SUMS.asc, and a detached
    # .asc next to each file. The private key and its passphrase live only in the secrets
    # STARBASE_GPG_PRIVATE_KEY / STARBASE_GPG_PASSPHRASE of the `release-signing` environment.
    name: Sign the downloads
    needs: [image, desktop, flatpak, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: starbase-appimage
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: starbase-flatpak
          path: dist
      # The Windows preview (not Authenticode-signed yet): in SHA256SUMS and GPG-signed like the rest.
      - uses: actions/download-artifact@v8
        with:
          pattern: starbase-*-x64-setup
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: starbase-windows-x64-portable
          path: dist
      - name: Versioned name for the Windows zip
        run: mv dist/starbase-windows-x64-portable.zip "dist/starbase-${GITHUB_REF_NAME#v}-windows-x64-portable.zip"
      - name: The draft's web zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'starbase-web-*.zip' --dir dist
      - name: Sign
        env:
          KEY: ${{ secrets.STARBASE_GPG_PRIVATE_KEY }}
          PASS: ${{ secrets.STARBASE_GPG_PASSPHRASE }}
        run: |
          [ -n "$KEY" ] && [ -n "$PASS" ] || { echo "release key secrets are missing"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$PASS" > "$RUNNER_TEMP/pass"
          printf '%s\n' "$KEY" | gpg --batch --import
          # Only the key published in the repo may sign: a wrong secret fails here.
          want=$(gpg --show-keys --with-colons packaging/linux/starbase-release-signing.asc | awk -F: '/^fpr/{print $10; exit}')
          gpg --list-secret-keys --with-colons | grep -q "^fpr:::::::::$want:" || { echo "secret key is not $want"; exit 1; }
          cd dist
          sha256sum -- * > SHA256SUMS
          for f in *; do
            gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/pass" -u "$want" --armor --detach-sign -- "$f"
          done
          rm -f "$RUNNER_TEMP/pass"
          for f in *.asc; do gpg --verify "$f" "${f%.asc}"; done
          ls -la
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          gh release upload "$GITHUB_REF_NAME" --clobber -- *.AppImage *.AppImage.zsync *.flatpak *.msi *-windows-x64-portable.zip SHA256SUMS *.asc

  flatpak-repo:
    # Our own Flatpak repository (packaging/linux/flatpak/make-repo.sh): the bundle from the
    # Flatpak job as a signed OSTree repository with static deltas, plus starbase.flatpakref and
    # starbase.flatpakrepo, signed with the same release key as the downloads.
    name: Flatpak repository (signed)
    needs: flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-signing
    # One Flatpak repository build or publish at a time across runs: two tags close together
    # would otherwise both build on the same published version and the last deploy would drop
    # the other's version. flatpak-repo-publish also checks that nothing was published meanwhile.
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      commit: ${{ steps.repo.outputs.commit }}
      base: ${{ steps.repo.outputs.base }}
    env:
      PAGES_URL: https://domeshifter.github.io/Starbase
      REF: app/io.github.DomeShifter.Starbase/x86_64/stable
      ALLOW_EMPTY: ${{ github.event_name == 'workflow_dispatch' && inputs.flatpak_repo_start_empty && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: starbase-flatpak
          path: dist
      - name: Flatpak and OSTree
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*; sudo apt-get update -qq && sudo apt-get install -y -qq flatpak ostree
      # flatpak signs through gpg-agent without asking, so the passphrase is preset in the agent
      # of a throwaway keyring (never on a command line, never printed).
      - name: Release key
        env:
          KEY: ${{ secrets.STARBASE_GPG_PRIVATE_KEY }}
          PASS: ${{ secrets.STARBASE_GPG_PASSPHRASE }}
        run: |
          [ -n "$KEY" ] && [ -n "$PASS" ] || { echo "release key secrets are missing"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          echo allow-preset-passphrase > "$GNUPGHOME/gpg-agent.conf"
          printf '%s\n' "$KEY" | gpg --batch --import
          want=$(gpg --show-keys --with-colons packaging/linux/starbase-release-signing.asc | awk -F: '/^fpr/{print $10; exit}')
          gpg --list-secret-keys --with-colons | grep -q "^fpr:::::::::$want:" || { echo "secret key is not $want"; exit 1; }
          preset="$(gpgconf --list-dirs libexecdir)/gpg-preset-passphrase"
          for grip in $(gpg --with-keygrip --with-colons --list-secret-keys "$want" | awk -F: '/^grp/{print $10}'); do
            printf '%s' "$PASS" | "$preset" --preset "$grip"
          done
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "SIGNING_KEY=$want" >> "$GITHUB_ENV"
      - name: Build and check the repository
        id: repo
        run: |
          packaging/linux/flatpak/make-repo.sh dist/*.flatpak site "$PAGES_URL" "$SIGNING_KEY" \
            packaging/linux/starbase-release-signing.asc
          gpgconf --kill gpg-agent
          echo "commit=$(ostree rev-parse --repo=site/repo "$REF")" >> "$GITHUB_OUTPUT"
          echo "base=$(ostree rev-parse --repo=site/repo "$REF^" 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
          {
            echo "### Flatpak repository"
            echo '```'; cut -c1-100 site/starbase.flatpakref; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: flatpak-repo-site
          retention-days: 7

  flatpak-repo-publish:
    # Publishes after everything else is green (tag), or by hand when asked. The `github-pages`
    # environment decides which refs may deploy (Settings > Environments).
    name: Publish the Flatpak repository (GitHub Pages)
    needs: [flatpak-repo, sign]
    if: >-
      !cancelled() && needs.flatpak-repo.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.sign.result == 'success')
      || (github.event_name == 'workflow_dispatch' && inputs.publish_flatpak_repo))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      PAGES_URL: https://domeshifter.github.io/Starbase
      REF: app/io.github.DomeShifter.Starbase/x86_64/stable
      BASE: ${{ needs.flatpak-repo.outputs.base }}
    steps:
      # The artifact was built on top of $BASE; if another run published since, deploying it
      # would drop that version. Stop instead (rerun the release to build on the new one).
      - name: Nothing published since the repository was built
        run: |
          code=$(curl -sS -o now.txt -w '%{http_code}' "$PAGES_URL/repo/refs/heads/$REF" || echo 000)
          if [ "$code" = 200 ]; then now=$(tr -d '[:space:]' < now.txt); elif [ "$code" = 404 ]; then now=none; else echo "Pages answered HTTP $code"; exit 1; fi
          echo "published now: $now, built on: $BASE"
          [ "$now" = "$BASE" ] || { echo "::error::another run published $now after this one fetched $BASE"; exit 1; }
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: flatpak-repo-site

  flatpak-repo-check:
    # What a user does on a fresh machine: install from the published .flatpakref, then run it.
    name: Install from the published repository
    needs: [flatpak-repo, flatpak-repo-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAGES_URL: https://domeshifter.github.io/Starbase
      APP_ID: io.github.DomeShifter.Starbase
      REF: app/io.github.DomeShifter.Starbase/x86_64/stable
      COMMIT: ${{ needs.flatpak-repo.outputs.commit }}
    steps:
      - name: Flatpak
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*; sudo apt-get update -qq && sudo apt-get install -y -qq flatpak
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Pages serves the new version
        run: |
          # The Pages CDN can take a few minutes to serve the new site everywhere.
          for _ in $(seq 1 15); do
            now=$(curl -fsS "$PAGES_URL/repo/refs/heads/$REF" 2>/dev/null | tr -d '[:space:]' || true)
            echo "published: ${now:-?}, want: $COMMIT"
            [ "$now" = "$COMMIT" ] && exit 0
            sleep 20
          done
          exit 1
      - name: Install from starbase.flatpakref (runtime from Flathub), check commit and version
        run: |
          flatpak install --user -y --noninteractive --from "$PAGES_URL/starbase.flatpakref"
          flatpak remote-list --user --show-details
          flatpak info --user "$APP_ID"
          got=$(flatpak info --user --show-commit "$APP_ID")
          [ "$got" = "$COMMIT" ] || { echo "::error::installed commit $got, published $COMMIT"; exit 1; }
          # A version tag must arrive as that version (the metainfo's newest <release>).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ver=$(flatpak info --user "$APP_ID" | awk -F': *' '/^ *Version:/{print $2; exit}')
            [ "$ver" = "${GITHUB_REF_NAME#v}" ] || { echo "::error::installed version '$ver', tag $GITHUB_REF_NAME (add the <release> to the metainfo)"; exit 1; }
          fi
          flatpak run "$APP_ID" --version
          flatpak run --command=stardocs "$APP_ID" --version
          flatpak update --user -y --noninteractive
