# StarDocs: builds the web app and the Linux desktop program (kept as `stardocs-linux-x86_64`),
# runs the native window tests (egui_kittest) and the lint
# checks on every push and pull request that touches stardocs/. The built site is kept as the
# `stardocs-web` artifact (30 days). WordCraft's web build needs more memory and disk than a
# small machine has (the wasm-bindgen step alone uses ~9 GB), which is why it runs here.
name: StarDocs
on:
  push:
    branches: [main]
    paths: ["stardocs/**", "starsheets/crates/connect/**", ".github/workflows/stardocs.yml", "rustfmt.toml"]
  pull_request:
    paths: ["stardocs/**", "starsheets/crates/connect/**", ".github/workflows/stardocs.yml", "rustfmt.toml"]
  workflow_dispatch:
  workflow_call: # from release.yml (the Starbase image)

permissions:
  contents: read

concurrency:
  group: stardocs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.22.2

defaults:
  run:
    working-directory: stardocs

jobs:
  web:
    name: Build web app
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Make disk space (WordCraft's build needs more than the runner leaves free)
        working-directory: /
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL; df -h /
      - uses: actions/checkout@v7
      - name: Fetch WordCraft at the pinned commit of our fork
        run: scripts/fetch-upstream.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
          workspaces: stardocs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | sudo tar xz -C /usr/local/bin trunk
          trunk --version
      - name: Build
        working-directory: stardocs/app
        run: trunk build --release
      - name: Record build info
        run: |
          printf '{"commit":"%s","wordcraft":"%s","built":"%s"}\n' "$GITHUB_SHA" "$(sed -n 's/^commit = "\(.*\)"/\1/p' upstream.pin)" "$(date -u +%FT%TZ)" > dist/build.json
          du -sh dist; ls -la dist/*.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: stardocs-web
          path: stardocs/dist/
          retention-days: 30

  test:
    name: Window tests (native, egui_kittest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Make disk space
        working-directory: /
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - name: Fetch WordCraft at the pinned commit of our fork
        run: scripts/fetch-upstream.sh
      - name: System libraries for egui's native backends
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libxkbcommon-dev libwayland-dev pkg-config libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          workspaces: stardocs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test -p stardocs

  coedit:
    # SPIKE A of the Docs co-editing design (stardocs/coedit): randomised two- and three-user
    # sessions on real WordCraft sessions must converge (same model, byte-identical .docx), the
    # step transform must agree both ways round, and the per-keystroke cost is printed.
    name: Co-editing spike (headless convergence)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Make disk space
        working-directory: /
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - name: Fetch WordCraft at the pinned commit of our fork
        run: scripts/fetch-upstream.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt -p stardocs-coedit --check
      - uses: Swatinem/rust-cache@v2
        with:
          key: coedit
          workspaces: stardocs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy -p stardocs-coedit --tests --no-deps -- -D warnings
      - name: Convergence (10,000 two-user + 4,000 three-user + 4,000 typing-only sessions, with undo), transform pairs + inverses, undo, 100-page cost
        run: cargo test -p stardocs-coedit -- --nocapture

  native:
    name: Desktop program (native, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Make disk space
        working-directory: /
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - name: Fetch WordCraft at the pinned commit of our fork
        run: scripts/fetch-upstream.sh
      - name: System libraries for egui's native backends, and a headless X server with OpenGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libxkbcommon-dev libwayland-dev pkg-config xvfb libgl1-mesa-dri libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: native
          workspaces: stardocs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (the desktop program, our code only)
        run: cargo clippy -p stardocs --no-deps -- -D warnings
      - name: Build
        run: cargo build --release -p stardocs
      - name: Local mode tests (open, type, autosave, reopen, conflict copy)
        run: cargo test --release -p stardocs local
      - name: Starts and stays up (a headless X server, 20 s)
        run: |
          target/release/stardocs --version
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          set +e; timeout 20 xvfb-run -a target/release/stardocs; code=$?; set -e
          echo "exit code $code (124: still running when stopped, as it should be)"
          test "$code" = 124
          test -d "$HOME/Documents/Starbase"
      - uses: actions/upload-artifact@v7
        with:
          name: stardocs-linux-x86_64
          path: stardocs/target/release/stardocs
          retention-days: 30

  lint:
    name: Formatting + clippy (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Make disk space
        working-directory: /
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - name: Fetch WordCraft at the pinned commit of our fork
        run: scripts/fetch-upstream.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt -p stardocs --check
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          workspaces: stardocs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (our code only, --no-deps; WordCraft is linted upstream)
        run: cargo clippy -p stardocs --no-deps --target wasm32-unknown-unknown -- -D warnings
