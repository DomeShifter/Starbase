name: Idea or missing feature
description: Something you'd like Starbase (Starbase Sheets, Starbase Docs, the home screen) to do
labels: ["idea"]
body:
  - type: textarea
    attributes:
      label: What would you like?
      description: If Google Sheets does it, how does it look there?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why it would help you
