[package]
name = "starsheets"
description = "Starbase Sheets: a Google Sheets-style spreadsheet for the web on GridCraft's engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "starsheets"
path = "src/main.rs"

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
gridcraft-chart = { workspace = true }
# SVG loader for the toolbar icons (resvg).
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
starsheets-sync = { path = "../crates/sync" }
serde = { version = "1", features = ["derive"] }
regex = "1"
# Preview pictures on the home screen (decoding them).
png = "0.18"
# The photo editor (home/photo_edit.rs): its edits and live preview, in the browser too (no
# decoders: the browser decodes).
starbase-photo-edit = { path = "../crates/photo-edit" }
starbase-templates = { path = "../crates/templates" }
image = { version = "0.25", default-features = false }
# Drive previews of Markdown files (home/textpreview.rs): parsing only, no HTML output.
pulldown-cmark = { version = "0.13", default-features = false }

# The desktop app (native.rs): GridCraft's own native window setup, local mode over a folder on
# disk (localstore.rs), the system's file dialogs and Trash; persistence remembers each
# program's window size and place; glow is the renderer when wgpu can't start (native.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "glow", "accesskit", "wayland", "x11", "clipboard", "persistence"] }
rfd = { workspace = true }
starsheets-sync = { path = "../crates/sync", features = ["thumbs"] }
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# A new, empty document for Starbase Docs (already in the build through GridCraft).
zip = { version = "3", default-features = false, features = ["deflate"] }
# "Connect to a server…" (remote.rs): device sign-in, the token in the system keyring, the files API.
starbase-connect = { path = "../crates/connect" }
# Photos (home/photos.rs): the desktop decodes pictures itself (the browser does on the web).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Event", "EventTarget", "BeforeUnloadEvent", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlIFrameElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Clipboard", "ClipboardItem", "Navigator", "MessageEvent", "UrlSearchParams", "AddEventListenerOptions", "Storage", "CustomEvent", "CustomEventInit", "Request", "RequestInit", "Response", "Headers", "History", "WebSocket", "BinaryType", "CloseEvent", "ImageBitmap", "ImageBitmapOptions", "ResizeQuality", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "ImageData", "HtmlTextAreaElement", "PointerEvent", "MouseEvent", "KeyboardEvent", "FocusEvent", "FocusOptions", "DomRect"] }

# Native tests of the photo editor (home/photo_edit.rs): egui_kittest's accessibility tree, no GPU.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37" }
