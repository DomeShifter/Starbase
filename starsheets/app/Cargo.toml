[package]
name = "starsheets"
description = "Starbase Sheets: a Google Sheets-style spreadsheet for the web on GridCraft's engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "starsheets"
path = "src/main.rs"

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
gridcraft-chart = { workspace = true }
# SVG loader for the toolbar icons (resvg).
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
starsheets-sync = { path = "../crates/sync" }
serde = { version = "1", features = ["derive"] }
regex = "1"
# Preview pictures on the home screen (decoding them).
png = "0.18"

# The desktop app (native.rs): GridCraft's own native window setup, local mode over a folder on
# disk (localstore.rs), the system's file dialogs and Trash.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "clipboard"] }
rfd = { workspace = true }
starsheets-sync = { path = "../crates/sync", features = ["thumbs"] }
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# A new, empty document for Starbase Docs (already in the build through GridCraft).
zip = { version = "3", default-features = false, features = ["deflate"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlIFrameElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Clipboard", "ClipboardItem", "Navigator", "MessageEvent", "UrlSearchParams", "AddEventListenerOptions", "Storage", "CustomEvent", "CustomEventInit", "Request", "RequestInit", "Response", "Headers", "History", "WebSocket", "BinaryType", "CloseEvent"] }
