[package]
name = "starsheets-sync"
description = "Live editing for Starbase Sheets, shared by the server and the web app: messages, replaying a change, workbook patches, fingerprints"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
gridcraft-engine = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
flate2 = "1"
# Preview pictures (thumb.rs) for the server and the desktop app's local Drive; off for the web app.
tiny-skia = { version = "0.11", optional = true }
ab_glyph = { version = "0.2", optional = true }
png = { version = "0.18", optional = true }

[features]
thumbs = ["dep:tiny-skia", "dep:ab_glyph", "dep:png"]
